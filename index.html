<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">MAGGIE STORE - App Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #00e676;
            --primary-dark: #00b248;
            --bg: #0b1120;
            --card-bg: #162032;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(22, 32, 50, 0.85);
            backdrop-filter: blur(14px);
            padding: 12px 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .store-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.2);
            transition: transform 0.3s ease;
            background: #1e293b;
        }

        .logo-container:hover .store-logo {
            transform: rotate(15deg) scale(1.05);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(45deg, #00e676, #00b0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .search-box {
            background: var(--bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 9px 18px;
            border-radius: 25px;
            color: white;
            width: 240px;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-box:focus {
            width: 290px;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);
        }

        .hero {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .hero h1 {
            font-size: 2.3rem;
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .social-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px auto 10px;
            padding: 0 20px;
        }

        .social-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .social-pill:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 230, 118, 0.3);
        }

        .category-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px 5%;
            max-width: 1200px;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .category-bar::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            color: #000;
            font-weight: 600;
            border-color: var(--primary);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 22px;
        }

        .reveal {
            opacity: 0;
            transform: translateY(25px) scale(0.97);
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            position: relative;
        }

        .app-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.45);
            border-color: rgba(0, 230, 118, 0.4);
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            object-fit: cover;
            background: #27354f;
            flex-shrink: 0;
        }

        .app-info {
            flex: 1;
            overflow: hidden;
        }

        .cat-badge {
            display: inline-block;
            font-size: 0.68rem;
            background: rgba(0, 230, 118, 0.12);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-desc-short {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin: 3px 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .install-btn {
            background: var(--primary);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, background 0.2s;
        }

        .install-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.06);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.12);
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-icon {
            width: 90px;
            height: 90px;
            border-radius: 22px;
            margin-bottom: 12px;
            object-fit: cover;
        }

        .modal-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 15px 0 25px;
            line-height: 1.6;
            max-height: 160px;
            overflow-y: auto;
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .search-box { width: 140px; }
            .search-box:focus { width: 170px; }
            .hero h1 { font-size: 1.8rem; }
            .logo { font-size: 1.15rem; }
            .store-logo { width: 34px; height: 34px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-container">
            <img id="storeLogo" src="https://via.placeholder.com/44/00e676/000000?text=M" alt="MAGGIE Logo" class="store-logo" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/44/00e676/000000?text=M'">
            <div id="storeName" class="logo">MAGGIE STORE</div>
        </a>
        <input type="text" id="searchInput" class="search-box" placeholder="Search apps...">
    </header>

    <section class="hero">
        <h1 id="heroTitle">Discover & Download Apps</h1>
        <p id="heroSubtitle">Fast, verified, and direct downloads powered by MAGGIE STORE</p>
        <div id="socialBar" class="social-bar"></div>
    </section>

    <div id="categoryBar" class="category-bar"></div>

    <div class="container">
        <div id="loader" style="text-align:center; padding:40px; color:var(--primary);">Loading MAGGIE STORE...</div>
        <div id="appGrid" class="app-grid"></div>
    </div>

    <footer>
        <div id="footerSocials" class="social-bar" style="margin-bottom: 12px;"></div>
        <p>&copy; 2026 <span class="store-footer-text">MAGGIE STORE</span>. All rights reserved.</p>
    </footer>

    <div id="appModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalIcon" src="" alt="App Icon" class="modal-icon" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/90?text=App'">
            <div id="modalCat" class="cat-badge" style="display:inline-block; margin-bottom:8px;">General</div>
            <h2 id="modalTitle">App Name</h2>
            <p id="modalDesc" class="modal-desc"></p>
            <a id="modalDownload" href="#" target="_blank" class="install-btn" style="padding: 12px 38px; font-size: 1rem;">Download Now</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz5VFvZ4nb7XOd8R72uW-aCYoLp0A_DAk",
            authDomain: "maggie-store-d3f3f.firebaseapp.com",
            projectId: "maggie-store-d3f3f",
            storageBucket: "maggie-store-d3f3f.firebasestorage.app",
            messagingSenderId: "646860878839",
            appId: "1:646860878839:web:1dd29cff6636c45bf374f2",
            measurementId: "G-BSTQZS5KQJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const appGrid = document.getElementById('appGrid');
        const categoryBar = document.getElementById('categoryBar');
        const searchInput = document.getElementById('searchInput');
        const socialBar = document.getElementById('socialBar');
        const footerSocials = document.getElementById('footerSocials');

        let allApps = [];
        let activeCategory = 'All';

        function cleanUrl(raw) {
            const val = (raw || '').trim();
            if (!val) return '';
            if (!val.startsWith('http://') && !val.startsWith('https://') && !val.startsWith('data:image/')) {
                return 'https://' + val;
            }
            return val;
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, index * 50);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.05 });

        onSnapshot(doc(db, "settings", "general"), (docSnap) => {
            if (docSnap.exists()) {
                const settings = docSnap.data();
                if (settings.logoUrl) {
                    document.getElementById('storeLogo').src = cleanUrl(settings.logoUrl);
                }
                if (settings.storeName) {
                    document.getElementById('storeName').innerText = settings.storeName;
                    document.getElementById('pageTitle').innerText = settings.storeName + " - App Hub";
                    document.getElementById('heroSubtitle').innerText = "Fast, verified, and direct downloads powered by " + settings.storeName;
                    document.querySelectorAll('.store-footer-text').forEach(el => el.innerText = settings.storeName);
                }
            }
        });

        function getPlatformIcon(platform) {
            const p = (platform || '').toLowerCase();
            if (p.includes('insta')) return 'fa-brands fa-instagram';
            if (p.includes('tele')) return 'fa-brands fa-telegram';
            if (p.includes('disc')) return 'fa-brands fa-discord';
            if (p.includes('you')) return 'fa-brands fa-youtube';
            if (p.includes('whats')) return 'fa-brands fa-whatsapp';
            if (p.includes('x') || p.includes('twit')) return 'fa-brands fa-x-twitter';
            if (p.includes('git')) return 'fa-brands fa-github';
            return 'fa-solid fa-link';
        }

        onSnapshot(collection(db, "socials"), (snapshot) => {
            socialBar.innerHTML = '';
            footerSocials.innerHTML = '';
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const iconClass = getPlatformIcon(data.platform);
                const html = `
                    <a href="${cleanUrl(data.url)}" target="_blank" class="social-pill">
                        <i class="${iconClass}"></i> ${data.platform}
                    </a>
                `;
                socialBar.innerHTML += html;
                footerSocials.innerHTML += html;
            });
        });

        onSnapshot(collection(db, "apps"), (snapshot) => {
            document.getElementById('loader').style.display = 'none';
            allApps = [];
            const categories = new Set(['All']);

            snapshot.forEach((docSnap) => {
                const appData = { id: docSnap.id, ...docSnap.data() };
                allApps.push(appData);
                if (appData.category) categories.add(appData.category);
            });

            renderCategories(Array.from(categories));
            filterAndRender();
        }, (err) => {
            document.getElementById('loader').innerHTML = `<span style="color:#ff5252;">Error: ${err.message}</span>`;
        });

        function renderCategories(cats) {
            categoryBar.innerHTML = '';
            cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${activeCategory === cat ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterAndRender();
                };
                categoryBar.appendChild(btn);
            });
        }

        function filterAndRender() {
            const term = searchInput.value.toLowerCase();
            const filtered = allApps.filter(appItem => {
                const name = (appItem.name || '').toLowerCase();
                const matchesSearch = name.includes(term);
                const matchesCat = activeCategory === 'All' || (appItem.category || 'General') === activeCategory;
                return matchesSearch && matchesCat;
            });
            renderApps(filtered);
        }

        function renderApps(apps) {
            appGrid.innerHTML = '';
            if (apps.length === 0) {
                appGrid.innerHTML = '<p style="color:#94a3b8; grid-column: 1/-1; text-align:center;">No apps found in this category.</p>';
                return;
            }

            apps.forEach((appItem, idx) => {
                const card = document.createElement('div');
                card.className = 'app-card reveal';
                card.innerHTML = `
                    <img src="${cleanUrl(appItem.logoUrl)}" alt="${appItem.name || 'App'}" class="app-icon" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/70?text=App'">
                    <div class="app-info">
                        <span class="cat-badge">${appItem.category || 'General'}</span>
                        <div class="app-title">${appItem.name || 'Unnamed App'}</div>
                        <div class="app-desc-short">${appItem.description || 'Tap to view details'}</div>
                        <a href="${cleanUrl(appItem.downloadUrl) || '#'}" target="_blank" class="install-btn" onclick="event.stopPropagation()">Install</a>
                    </div>
                `;
                card.onclick = () => openModal(appItem);
                appGrid.appendChild(card);
                observer.observe(card);

                if (idx < 8) {
                    setTimeout(() => card.classList.add('visible'), idx * 60);
                }
            });
        }

        searchInput.addEventListener('input', filterAndRender);

        window.openModal = (appItem) => {
            document.getElementById('modalIcon').src = cleanUrl(appItem.logoUrl);
            document.getElementById('modalCat').innerText = appItem.category || 'General';
            document.getElementById('modalTitle').innerText = appItem.name || 'App';
            document.getElementById('modalDesc').innerText = appItem.description || 'No description provided for this app.';
            document.getElementById('modalDownload').href = cleanUrl(appItem.downloadUrl) || '#';
            document.getElementById('appModal').style.display = 'flex';
        };

        window.closeModal = () => document.getElementById('appModal').style.display = 'none';
        window.onclick = (e) => { if (e.target === document.getElementById('appModal')) closeModal(); };
    </script>
</body>
</html>
