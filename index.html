<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">MAGGIE STORE - App Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #00e676;
            --primary-glow: rgba(0, 230, 118, 0.28);
            --accent: #00b0ff;
            --bg: #070c17;
            --bg-elevated: #0e1627;
            --card-bg: rgba(18, 28, 48, 0.78);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 15% 10%, rgba(0, 230, 118, 0.12), transparent 35%),
                radial-gradient(circle at 85% 15%, rgba(0, 176, 255, 0.12), transparent 35%);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(10, 17, 32, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 13px 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .store-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
            transition: transform 0.35s ease;
            background: #162032;
        }

        .logo-container:hover .store-logo {
            transform: rotate(12deg) scale(1.06);
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.6px;
        }

        .search-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrap i {
            position: absolute;
            left: 15px;
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        .search-box {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 9px 16px 9px 38px;
            border-radius: 999px;
            color: white;
            width: 230px;
            font-size: 0.86rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-box:focus {
            width: 280px;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.14);
        }

        .hero {
            text-align: center;
            padding: 46px 20px 22px;
            max-width: 780px;
            margin: 0 auto;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.25);
            color: var(--primary);
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .hero h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.18;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .social-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 22px auto 8px;
            padding: 0 16px;
        }

        .social-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.83rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .social-pill:hover {
            background: var(--primary);
            color: #041008;
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .category-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 14px 5%;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .category-bar::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.83rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: linear-gradient(135deg, var(--primary), #00c853);
            color: #041008;
            font-weight: 600;
            border-color: transparent;
            box-shadow: 0 6px 16px var(--primary-glow);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 18px 20px 28px;
            flex: 1;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(295px, 1fr));
            gap: 20px;
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 22px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45);
            border-color: rgba(0, 230, 118, 0.45);
        }

        .app-icon {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            object-fit: cover;
            background: #1e293b;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .app-info {
            flex: 1;
            overflow: hidden;
        }

        .cat-badge {
            display: inline-block;
            font-size: 0.68rem;
            background: rgba(0, 176, 255, 0.14);
            color: #38bdf8;
            padding: 2px 9px;
            border-radius: 999px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .app-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.08rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-desc-short {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin: 3px 0 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .install-btn {
            background: linear-gradient(135deg, var(--primary), #00c853);
            color: #041008;
            font-weight: 700;
            border: none;
            padding: 6px 18px;
            border-radius: 999px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .install-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 16px var(--primary-glow);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 15, 0.82);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-content {
            background: #101a2f;
            padding: 30px 24px;
            border-radius: 26px;
            max-width: 430px;
            width: 100%;
            text-align: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
            animation: modalPop 0.25s ease;
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }

        .close-btn:hover { color: var(--text); }

        .modal-icon {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            margin-bottom: 12px;
            object-fit: cover;
            border: 2px solid rgba(0, 230, 118, 0.35);
        }

        .modal-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 14px 0 24px;
            line-height: 1.65;
            max-height: 160px;
            overflow-y: auto;
        }

        footer {
            text-align: center;
            padding: 24px 16px;
            border-top: 1px solid var(--border);
            background: rgba(9, 15, 28, 0.7);
            color: var(--text-muted);
            font-size: 0.84rem;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .search-box { width: 136px; font-size: 0.8rem; }
            .search-box:focus { width: 162px; }
            .hero h1 { font-size: 1.85rem; }
            .logo { font-size: 1.15rem; }
            .store-logo { width: 36px; height: 36px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-container">
            <img id="storeLogo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4OCIgaGVpZ2h0PSI4OCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iIzAwZTY3NiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTglIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjQyIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9ImJvbGQiIGZpbGw9IiMwMDAiPk08L3RleHQ+PC9zdmc+" alt="Logo" class="store-logo" referrerpolicy="no-referrer">
            <div id="storeName" class="logo">MAGGIE STORE</div>
        </a>
        <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-box" placeholder="Search apps...">
        </div>
    </header>

    <section class="hero">
        <div class="hero-badge"><i class="fa-solid fa-bolt"></i> Verified App Hub</div>
        <h1 id="heroTitle">Discover & Download Apps</h1>
        <p id="heroSubtitle">Fast, verified, and direct downloads powered by MAGGIE STORE</p>
        <div id="socialBar" class="social-bar"></div>
    </section>

    <div id="categoryBar" class="category-bar"></div>

    <div class="container">
        <div id="loader" style="text-align:center; padding:44px; color:var(--primary); font-weight:500;">
            <i class="fa-solid fa-circle-notch fa-spin" style="margin-right:8px;"></i> Loading MAGGIE STORE...
        </div>
        <div id="appGrid" class="app-grid"></div>
    </div>

    <footer>
        <div id="footerSocials" class="social-bar" style="margin-bottom: 12px;"></div>
        <p>&copy; 2026 <span class="store-footer-text">MAGGIE STORE</span>. All rights reserved.</p>
    </footer>

    <div id="appModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalIcon" src="" alt="Icon" class="modal-icon" referrerpolicy="no-referrer">
            <div id="modalCat" class="cat-badge" style="margin-bottom:8px;">General</div>
            <h2 id="modalTitle" style="font-family:'Outfit',sans-serif;">App Name</h2>
            <p id="modalDesc" class="modal-desc"></p>
            <a id="modalDownload" href="#" target="_blank" class="install-btn" style="padding: 12px 34px; font-size: 0.96rem;">
                <i class="fa-solid fa-download"></i> Download Now
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz5VFvZ4nb7XOd8R72uW-aCYoLp0A_DAk",
            authDomain: "maggie-store-d3f3f.firebaseapp.com",
            projectId: "maggie-store-d3f3f",
            storageBucket: "maggie-store-d3f3f.firebasestorage.app",
            messagingSenderId: "646860878839",
            appId: "1:646860878839:web:1dd29cff6636c45bf374f2",
            measurementId: "G-BSTQZS5KQJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const appGrid = document.getElementById('appGrid');
        const categoryBar = document.getElementById('categoryBar');
        const searchInput = document.getElementById('searchInput');
        const socialBar = document.getElementById('socialBar');
        const footerSocials = document.getElementById('footerSocials');

        const FALLBACK_STORE = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4OCIgaGVpZ2h0PSI4OCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iIzAwZTY3NiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTglIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjQyIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9ImJvbGQiIGZpbGw9IiMwMDAiPk08L3RleHQ+PC9zdmc+";
        const FALLBACK_APP = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNDAiIGhlaWdodD0iMTQwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMjczNTRmIi8+PHRleHQgeD0iNTAlIiB5PSI1NSUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjYiIGZvbnQtZmFtaWx5PSJBcmlhbCxzYW5zLXNlcmlmIiBmaWxsPSIjOTRhM2I4Ij5BUFA8L3RleHQ+PC9zdmc+";

        let allApps = [];
        let activeCategory = 'All';
        const resolvedUrlCache = new Map();

        function cleanUrl(raw) {
            const val = (raw || '').trim();
            if (!val) return '';
            if (!val.startsWith('http://') && !val.startsWith('https://') && !val.startsWith('data:image/')) {
                return 'https://' + val;
            }
            return val;
        }

        async function extractDirectImageUrl(rawUrl) {
            const url = cleanUrl(rawUrl);
            if (!url) return '';
            if (resolvedUrlCache.has(url)) return resolvedUrlCache.get(url);

            const ibbPageMatch = url.match(/^https?:\/\/(?:www\.)?ibb\.co\/([a-zA-Z0-9_-]+)\/?$/i);
            if (ibbPageMatch) {
                const proxies = [
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    `https://corsproxy.io/?${encodeURIComponent(url)}`
                ];
                for (const proxyUrl of proxies) {
                    try {
                        const res = await fetch(proxyUrl);
                        if (!res.ok) continue;
                        const html = await res.text();
                        const match = html.match(/https?:\/\/i\.ibb\.co\/[a-zA-Z0-9_-]+\/[^"'\s<>\\]+/i);
                        if (match && match[0]) {
                            resolvedUrlCache.set(url, match[0]);
                            return match[0];
                        }
                    } catch (_) {}
                }
            }

            resolvedUrlCache.set(url, url);
            return url;
        }

        async function setSmartImage(imgEl, rawUrl, fallbackUrl) {
            imgEl.src = fallbackUrl;
            const resolved = await extractDirectImageUrl(rawUrl);
            if (!resolved) return;

            const testImg = new Image();
            testImg.referrerPolicy = 'no-referrer';
            testImg.onload = () => {
                imgEl.src = resolved;
            };
            testImg.onerror = async () => {
                try {
                    const res = await fetch(resolved);
                    if (!res.ok) return;
                    const blob = await res.blob();
                    if (!blob.type.startsWith('image/')) return;
                    imgEl.src = URL.createObjectURL(blob);
                } catch (_) {
                    imgEl.src = fallbackUrl;
                }
            };
            testImg.src = resolved;
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, index * 45);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.05 });

        onSnapshot(doc(db, "settings", "general"), (docSnap) => {
            if (docSnap.exists()) {
                const settings = docSnap.data();
                if (settings.logoUrl) {
                    setSmartImage(document.getElementById('storeLogo'), settings.logoUrl, FALLBACK_STORE);
                }
                if (settings.storeName) {
                    document.getElementById('storeName').innerText = settings.storeName;
                    document.getElementById('pageTitle').innerText = settings.storeName + " - App Hub";
                    document.getElementById('heroSubtitle').innerText = "Fast, verified, and direct downloads powered by " + settings.storeName;
                    document.querySelectorAll('.store-footer-text').forEach(el => el.innerText = settings.storeName);
                }
            }
        });

        function getPlatformIcon(platform) {
            const p = (platform || '').toLowerCase();
            if (p.includes('insta')) return 'fa-brands fa-instagram';
            if (p.includes('tele')) return 'fa-brands fa-telegram';
            if (p.includes('disc')) return 'fa-brands fa-discord';
            if (p.includes('you')) return 'fa-brands fa-youtube';
            if (p.includes('whats')) return 'fa-brands fa-whatsapp';
            if (p.includes('x') || p.includes('twit')) return 'fa-brands fa-x-twitter';
            if (p.includes('git')) return 'fa-brands fa-github';
            return 'fa-solid fa-link';
        }

        onSnapshot(collection(db, "socials"), (snapshot) => {
            socialBar.innerHTML = '';
            footerSocials.innerHTML = '';
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const iconClass = getPlatformIcon(data.platform);
                const html = `
                    <a href="${cleanUrl(data.url)}" target="_blank" class="social-pill">
                        <i class="${iconClass}"></i> ${data.platform}
                    </a>
                `;
                socialBar.innerHTML += html;
                footerSocials.innerHTML += html;
            });
        });

        onSnapshot(collection(db, "apps"), (snapshot) => {
            document.getElementById('loader').style.display = 'none';
            allApps = [];
            const categories = new Set(['All']);

            snapshot.forEach((docSnap) => {
                const appData = { id: docSnap.id, ...docSnap.data() };
                allApps.push(appData);
                if (appData.category) categories.add(appData.category);
            });

            renderCategories(Array.from(categories));
            filterAndRender();
        }, (err) => {
            document.getElementById('loader').innerHTML = `<span style="color:#ff5252;">Error: ${err.message}</span>`;
        });

        function renderCategories(cats) {
            categoryBar.innerHTML = '';
            cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${activeCategory === cat ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterAndRender();
                };
                categoryBar.appendChild(btn);
            });
        }

        function filterAndRender() {
            const term = searchInput.value.toLowerCase();
            const filtered = allApps.filter(appItem => {
                const name = (appItem.name || '').toLowerCase();
                const matchesSearch = name.includes(term);
                const matchesCat = activeCategory === 'All' || (appItem.category || 'General') === activeCategory;
                return matchesSearch && matchesCat;
            });
            renderApps(filtered);
        }

        function renderApps(apps) {
            appGrid.innerHTML = '';
            if (apps.length === 0) {
                appGrid.innerHTML = '<p style="color:#94a3b8; grid-column: 1/-1; text-align:center;">No apps found in this category.</p>';
                return;
            }

            apps.forEach((appItem, idx) => {
                const card = document.createElement('div');
                card.className = 'app-card reveal';
                card.innerHTML = `
                    <img src="${FALLBACK_APP}" alt="Icon" class="app-icon" referrerpolicy="no-referrer">
                    <div class="app-info">
                        <span class="cat-badge">${appItem.category || 'General'}</span>
                        <div class="app-title">${appItem.name || 'Unnamed App'}</div>
                        <div class="app-desc-short">${appItem.description || 'Tap to view details'}</div>
                        <a href="${cleanUrl(appItem.downloadUrl) || '#'}" target="_blank" class="install-btn" onclick="event.stopPropagation()">
                            <i class="fa-solid fa-download"></i> Install
                        </a>
                    </div>
                `;
                const imgEl = card.querySelector('.app-icon');
                setSmartImage(imgEl, appItem.logoUrl, FALLBACK_APP);

                card.onclick = () => openModal(appItem);
                appGrid.appendChild(card);
                observer.observe(card);

                if (idx < 8) {
                    setTimeout(() => card.classList.add('visible'), idx * 55);
                }
            });
        }

        searchInput.addEventListener('input', filterAndRender);

        window.openModal = (appItem) => {
            setSmartImage(document.getElementById('modalIcon'), appItem.logoUrl, FALLBACK_APP);
            document.getElementById('modalCat').innerText = appItem.category || 'General';
            document.getElementById('modalTitle').innerText = appItem.name || 'App';
            document.getElementById('modalDesc').innerText = appItem.description || 'No description provided for this app.';
            document.getElementById('modalDownload').href = cleanUrl(appItem.downloadUrl) || '#';
            document.getElementById('appModal').style.display = 'flex';
        };

        window.closeModal = () => document.getElementById('appModal').style.display = 'none';
        window.onclick = (e) => { if (e.target === document.getElementById('appModal')) closeModal(); };
    </script>
</body>
</html>
