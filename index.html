<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGGIE STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root, [data-theme="dark"] {
            --bg: #07090e;
            --surface: #121722;
            --surface-2: #19202f;
            --ink: #f4f6fb;
            --muted: #98a4b8;
            --accent: #10b981;
            --accent-ink: #04130d;
            --coral: #ff4d5a;
            --warm: #f59e0b;
            --border: rgba(255, 255, 255, 0.09);
            --shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
        }

        [data-theme="light"] {
            --bg: #eef2f7;
            --surface: #ffffff;
            --surface-2: #e6ecf4;
            --ink: #141820;
            --muted: #5b6475;
            --accent: #059669;
            --accent-ink: #ffffff;
            --coral: #e11d48;
            --warm: #d97706;
            --border: rgba(20, 24, 32, 0.11);
            --shadow: 0 14px 32px rgba(20, 24, 32, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Noto Sans', sans-serif;
        }

        .styled-name-text {
            font-family: 'Noto Sans', 'Plus Jakarta Sans', 'DejaVu Sans', 'Segoe UI Symbol', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif !important;
            text-transform: none !important;
            line-height: 1.4;
        }

        body {
            background: radial-gradient(circle at 75% 15%, rgba(16, 185, 129, 0.08), transparent 42%),
                        radial-gradient(circle at 20% 80%, rgba(255, 77, 90, 0.07), transparent 45%),
                        var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding-bottom: 64px;
            transition: background 0.25s ease, color 0.25s ease;
            overflow-x: clip;
        }

        /* Infinity Trail Loader */
        #infinityTrailLoader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: color-mix(in srgb, var(--bg) 94%, transparent);
            backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.36s ease, visibility 0.36s ease;
        }

        #infinityTrailLoader.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .infinity-stage {
            position: relative;
            width: 184px;
            height: 92px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .infinity-svg {
            width: 184px;
            height: 92px;
            overflow: visible;
        }

        .infinity-track {
            fill: none;
            stroke: var(--border);
            stroke-width: 5;
            stroke-linecap: round;
        }

        .infinity-glow-trail {
            fill: none;
            stroke: url(#infinityTrailGrad);
            stroke-width: 6.5;
            stroke-linecap: round;
            stroke-dasharray: 86 240;
            stroke-dashoffset: 0;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.55));
            animation: infinityDashMove 1.45s linear infinite;
        }

        .infinity-spark {
            fill: #ffffff;
            filter: drop-shadow(0 0 10px #34d399) drop-shadow(0 0 18px #ff4d5a);
            offset-path: path("M 92,46 C 92,16 32,16 32,46 C 32,76 92,76 92,46 C 92,16 152,16 152,46 C 152,76 92,76 92,46 Z");
            offset-rotate: auto;
            animation: infinitySparkOrbit 1.45s linear infinite;
        }

        .infinity-echo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            position: absolute;
            offset-path: path("M 92,46 C 92,16 32,16 32,46 C 32,76 92,76 92,46 C 92,16 152,16 152,46 C 152,76 92,76 92,46 Z");
            offset-rotate: auto;
            animation: infinitySparkOrbit 1.45s linear infinite;
        }

        .infinity-echo-1 {
            opacity: 0.65;
            transform: scale(0.82);
            animation-delay: -0.09s;
            background: #34d399;
        }

        .infinity-echo-2 {
            opacity: 0.42;
            transform: scale(0.65);
            animation-delay: -0.18s;
            background: var(--warm);
        }

        .infinity-echo-3 {
            opacity: 0.22;
            transform: scale(0.48);
            animation-delay: -0.27s;
            background: var(--coral);
        }

        @keyframes infinityDashMove {
            from { stroke-dashoffset: 326; }
            to { stroke-dashoffset: 0; }
        }

        @keyframes infinitySparkOrbit {
            0% { offset-distance: 0%; }
            100% { offset-distance: 100%; }
        }

        .loader-caption {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        @keyframes smoothReveal {
            from { opacity: 0; transform: translate3d(0, 14px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .reveal-item {
            opacity: 0;
            transform: translate3d(0, 14px, 0);
            transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .reveal-item.in-view {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 90;
            background: color-mix(in srgb, var(--surface) 88%, transparent);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: 12px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
            color: var(--ink);
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--surface-2);
            border: 1px solid var(--border);
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.16s ease, border-color 0.2s ease;
        }

        .icon-btn:hover {
            transform: translateY(-1px);
            border-color: var(--accent);
        }

        .container {
            max-width: 1140px;
            margin: 24px auto 0;
            padding: 0 20px;
        }

        .hero-banner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 22px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            animation: smoothReveal 0.45s ease both;
        }

        .hero-title {
            font-size: clamp(1.5rem, 3vw, 2.1rem);
            font-weight: 800;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        .hero-sub {
            color: var(--muted);
            font-size: 0.92rem;
            margin-top: 6px;
            max-width: 560px;
        }

        .uid-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .uid-avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .uid-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            font-weight: 700;
        }

        .uid-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .copy-btn {
            background: var(--accent);
            color: var(--accent-ink);
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .gallery-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 22px;
            scrollbar-width: none;
        }
        .gallery-strip::-webkit-scrollbar { display: none; }

        .gallery-thumb {
            height: 76px;
            width: auto;
            min-width: 76px;
            max-width: 140px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid var(--border);
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .gallery-thumb:hover { transform: scale(1.03); }

        .nav-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: var(--surface);
            padding: 6px;
            border-radius: 15px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 9px 16px;
            border-radius: 11px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent);
            color: var(--accent-ink);
        }

        .search-wrap {
            position: relative;
            min-width: 240px;
            flex: 1;
            max-width: 340px;
        }

        .search-wrap i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.85rem;
        }

        .search-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--ink);
            border-radius: 13px;
            padding: 10px 14px 10px 36px;
            font-size: 0.86rem;
            outline: none;
        }

        .search-input:focus { border-color: var(--accent); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 15px;
            object-fit: cover;
            background: var(--surface-2);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .card-title {
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 5px;
        }

        .badge {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 7px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .badge-cat {
            background: var(--surface-2);
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .badge-free {
            background: color-mix(in srgb, var(--accent) 16%, transparent);
            color: var(--accent);
        }

        .badge-paid {
            background: color-mix(in srgb, var(--warm) 18%, transparent);
            color: var(--warm);
        }

        .card-desc {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.48;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 4px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.83rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            text-decoration: none;
            transition: opacity 0.2s ease, transform 0.15s ease;
        }

        .btn:hover { opacity: 0.93; transform: translateY(-1px); }
        .btn-primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
        .btn-paid { background: var(--warm); color: #141820; flex: 1; }
        .btn-ghost {
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--border);
        }

        .socials-section {
            margin-top: 36px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .section-heading {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.015em;
            margin-bottom: 14px;
        }

        .socials-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .social-chip {
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--border);
            padding: 9px 15px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .social-chip:hover { border-color: var(--accent); }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.72);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 200;
        }

        .modal-backdrop.open { display: flex; }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            max-width: 680px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            padding: 22px;
            box-shadow: var(--shadow);
            animation: smoothReveal 0.25s ease both;
        }

        .modal-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--ink);
            cursor: pointer;
            font-size: 1rem;
        }

        .shots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 14px 0;
        }

        .shot-img {
            width: 100%;
            height: auto;
            max-height: 460px;
            object-fit: contain;
            background: var(--surface-2);
            border-radius: 14px;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 44px 20px;
            color: var(--muted);
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 20px;
        }

        .toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--ink);
            color: var(--bg);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.84rem;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 400;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Infinity Trail Loading Overlay -->
    <div id="infinityTrailLoader" aria-label="Loading MAGGIE STORE">
        <div class="infinity-stage">
            <svg class="infinity-svg" viewBox="0 0 184 92" aria-hidden="true">
                <defs>
                    <linearGradient id="infinityTrailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#10b981" />
                        <stop offset="55%" stop-color="#f59e0b" />
                        <stop offset="100%" stop-color="#ff4d5a" />
                    </linearGradient>
                </defs>
                <path class="infinity-track" d="M 92,46 C 92,16 32,16 32,46 C 32,76 92,76 92,46 C 92,16 152,16 152,46 C 152,76 92,76 92,46 Z" />
                <path class="infinity-glow-trail" d="M 92,46 C 92,16 32,16 32,46 C 32,76 92,76 92,46 C 92,16 152,16 152,46 C 152,76 92,76 92,46 Z" />
                <circle class="infinity-spark" r="4.5" />
            </svg>
            <span class="infinity-echo-dot infinity-echo-1"></span>
            <span class="infinity-echo-dot infinity-echo-2"></span>
            <span class="infinity-echo-dot infinity-echo-3"></span>
        </div>
        <div class="loader-caption">Loading MAGGIE STORE...</div>
    </div>

    <header>
        <a href="index.html" class="brand-box">
            <img id="storeLogo" src="" alt="Logo" class="brand-logo" style="display:none;">
            <span id="storeName" class="brand-name styled-name-text">MAGGIE STORE</span>
        </a>
        <div class="header-right">
            <button type="button" class="icon-btn" onclick="toggleTheme()" title="Toggle Dark / Light Mode">
                <i id="themeIcon" class="fa-solid fa-sun"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <section class="hero-banner">
            <div>
                <h1 id="heroTitle" class="hero-title styled-name-text">Apps, XML Packs &amp; Templates</h1>
                <p class="hero-sub">Free aur paid apps download karein, ya XML &amp; templates ke screenshots dekh kar instant unlock karein.</p>
            </div>

            <div id="uidBox" class="uid-card" style="display:none;">
                <img id="uidPhoto" src="" alt="Profile" class="uid-avatar" style="display:none;" onclick="openPhotoLightbox(this.src)">
                <div>
                    <div id="uidLabel" class="uid-label styled-name-text">GAME UID</div>
                    <div id="uidValue" class="uid-value styled-name-text"></div>
                </div>
                <button type="button" class="copy-btn" onclick="copyUid()">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>
        </section>

        <div id="extraGallery" class="gallery-strip" style="display:none;"></div>

        <div class="nav-row">
            <div class="tabs">
                <button type="button" class="tab-btn active" id="tabApps" onclick="switchSection('apps')">
                    <i class="fa-solid fa-mobile-screen"></i> Apps
                </button>
                <button type="button" class="tab-btn" id="tabXml" onclick="switchSection('xml')">
                    <i class="fa-solid fa-layer-group"></i> XML &amp; Templates
                </button>
            </div>

            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search apps, XML, templates..." oninput="renderCurrentSection()">
            </div>
        </div>

        <div id="cardsGrid" class="grid"></div>

        <section id="socialsSection" class="socials-section" style="display:none;">
            <h2 class="section-heading">Connect With Us</h2>
            <div id="socialsList" class="socials-list"></div>
        </section>
    </div>

    <!-- Preview & Unlock Modal -->
    <div id="previewModal" class="modal-backdrop" onclick="if(event.target===this) closeModal()">
        <div class="modal-box">
            <div class="modal-top">
                <div>
                    <h3 id="modalTitle" class="modal-title styled-name-text"></h3>
                    <div id="modalBadges" class="badges"></div>
                </div>
                <button type="button" class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p id="modalDesc" class="styled-name-text" style="color:var(--muted); font-size:0.9rem; line-height:1.55;"></p>
            <div id="modalShots" class="shots-grid"></div>
            <div id="modalActionArea" style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const FALLBACK_ICON = "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2788%27%20height%3D%2788%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%231c2330%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2758%25%27%20dominant-baseline%3D%27middle%27%20text-anchor%3D%27middle%27%20font-size%3D%2726%27%20font-family%3D%27Arial%2Csans-serif%27%20font-weight%3D%27bold%27%20fill%3D%27%239aa4b8%27%3EMAGGIE%3C/text%3E%3C/svg%3E";

        let loaderDismissTimer = null;

        window.showInfinityLoader = function (labelText) {
            clearTimeout(loaderDismissTimer);
            const loader = document.getElementById("infinityTrailLoader");
            const caption = loader?.querySelector(".loader-caption");
            if (caption && labelText) caption.innerText = labelText;
            if (loader) loader.classList.remove("is-hidden");
        };

        window.hideInfinityLoader = function (delayMs = 260) {
            clearTimeout(loaderDismissTimer);
            loaderDismissTimer = setTimeout(() => {
                const loader = document.getElementById("infinityTrailLoader");
                if (loader) loader.classList.add("is-hidden");
            }, delayMs);
        };

        (function initTheme() {
            const saved = localStorage.getItem("maggie_theme") || "dark";
            document.documentElement.setAttribute("data-theme", saved);
            updateThemeIcon(saved);
        })();

        function updateThemeIcon(theme) {
            const icon = document.getElementById("themeIcon");
            if (icon) icon.className = theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        window.toggleTheme = function () {
            const cur = document.documentElement.getAttribute("data-theme") || "dark";
            const next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("maggie_theme", next);
            updateThemeIcon(next);
        };

        window.sanitizeText = function (raw) {
            if (!raw) return "";
            return String(raw)
                .replace(/[\u0300-\u036f\u0483-\u0489\u1ab0-\u1aff\u1dc0-\u1dff\u20d0-\u20ff\ufe20-\ufe2f]/g, "")
                .replace(/[\u200b-\u200d\ufeff]/g, "")
                .replace(/\s{2,}/g, " ")
                .trim();
        };

        window.showToast = function (msg) {
            const el = document.getElementById("toast");
            el.innerText = msg;
            el.classList.add("show");
            setTimeout(() => el.classList.remove("show"), 2400);
        };

        window.copyUid = function () {
            const val = document.getElementById("uidValue")?.innerText?.trim();
            if (!val) return;
            navigator.clipboard?.writeText(val);
            window.showToast("UID copied!");
        };

        window.openPhotoLightbox = function (src) {
            if (!src) return;
            window.open(src, "_blank", "noopener,noreferrer");
        };

        const scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("in-view");
                }
            });
        }, { threshold: 0.08 });

        window.observeRevealElements = function () {
            document.querySelectorAll(".reveal-item").forEach((el) => {
                scrollObserver.observe(el);
                const rect = el.getBoundingClientRect();
                if (rect.top < window.innerHeight * 0.96) {
                    el.classList.add("in-view");
                }
            });
        };

        window.addEventListener("load", () => {
            window.hideInfinityLoader(350);
        });
        setTimeout(() => window.hideInfinityLoader(0), 3200);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getFirestore, collection, doc, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz5VFvZ4nb7XOd8R72uW-aCYoLp0A_DAk",
            authDomain: "maggie-store-d3f3f.firebaseapp.com",
            projectId: "maggie-store-d3f3f",
            storageBucket: "maggie-store-d3f3f.firebasestorage.app",
            messagingSenderId: "646860878839",
            appId: "1:646860878839:web:1dd29cff6636c45bf374f2",
            measurementId: "G-BSTQZS5KQJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentSection = "apps";
        let appsData = [];
        let xmlData = [];
        let loadedStreams = 0;

        function markStreamLoaded() {
            loadedStreams += 1;
            if (loadedStreams >= 2) {
                window.hideInfinityLoader(220);
            }
        }

        function safeUrl(raw) {
            const v = (raw || "").trim();
            if (!v) return "";
            if (!v.startsWith("http://") && !v.startsWith("https://") && !v.startsWith("data:image/")) {
                return "https://" + v;
            }
            return v;
        }

        window.switchSection = function (section) {
            currentSection = section;
            document.getElementById("tabApps").classList.toggle("active", section === "apps");
            document.getElementById("tabXml").classList.toggle("active", section === "xml");
            renderCurrentSection();
        };

        onSnapshot(collection(db, "apps"), (snap) => {
            appsData = [];
            snap.forEach(d => appsData.push({ id: d.id, ...d.data() }));
            if (currentSection === "apps") renderCurrentSection();
            markStreamLoaded();
        }, () => markStreamLoaded());

        onSnapshot(collection(db, "xmlTemplates"), (snap) => {
            xmlData = [];
            snap.forEach(d => xmlData.push({ id: d.id, ...d.data() }));
            if (currentSection === "xml") renderCurrentSection();
            markStreamLoaded();
        }, () => markStreamLoaded());

        onSnapshot(doc(db, "settings", "general"), (snap) => {
            if (!snap.exists()) return;
            const s = snap.data();

            const name = window.sanitizeText(s.storeName) || "MAGGIE STORE";
            document.getElementById("storeName").innerText = name;
            document.title = name;

            const logoEl = document.getElementById("storeLogo");
            const logoUrl = safeUrl(s.logoUrl);
            if (logoUrl) {
                logoEl.src = logoUrl;
                logoEl.style.display = "block";
            } else {
                logoEl.style.display = "none";
            }

            const uidBox = document.getElementById("uidBox");
            const uidValEl = document.getElementById("uidValue");
            const uidLabelEl = document.getElementById("uidLabel");
            const uidPhotoEl = document.getElementById("uidPhoto");

            const cleanUid = window.sanitizeText(s.gameUid || "");
            const cleanLabel = window.sanitizeText(s.gameLabel || "");
            const mainPhoto = safeUrl(s.gameMainPhoto || "");

            if (cleanUid || mainPhoto) {
                uidBox.style.display = "flex";
                uidLabelEl.innerText = cleanLabel || "GAME UID";
                uidValEl.innerText = cleanUid || "—";
                uidValEl.style.display = cleanUid ? "block" : "none";
                if (mainPhoto) {
                    uidPhotoEl.src = mainPhoto;
                    uidPhotoEl.style.display = "block";
                } else {
                    uidPhotoEl.style.display = "none";
                }
            } else {
                uidBox.style.display = "none";
            }

            const galleryEl = document.getElementById("extraGallery");
            const extras = Array.isArray(s.gameExtraPhotos) ? s.gameExtraPhotos.map(safeUrl).filter(Boolean) : [];
            if (extras.length > 0) {
                galleryEl.style.display = "flex";
                galleryEl.innerHTML = extras.map(url => `<img src="${url}" alt="Gallery" class="gallery-thumb" onclick="openPhotoLightbox('${url}')">`).join("");
            } else {
                galleryEl.style.display = "none";
                galleryEl.innerHTML = "";
            }
        });

        onSnapshot(collection(db, "socials"), (snap) => {
            const sec = document.getElementById("socialsSection");
            const list = document.getElementById("socialsList");
            list.innerHTML = "";
            let count = 0;
            snap.forEach(d => {
                const item = d.data();
                const link = safeUrl(item.url);
                if (!link) return;
                count += 1;
                const a = document.createElement("a");
                a.href = link;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.className = "social-chip styled-name-text";
                a.innerHTML = `<i class="fa-solid fa-arrow-up-right-from-square"></i> ${window.sanitizeText(item.platform || "Link")}`;
                list.appendChild(a);
            });
            sec.style.display = count > 0 ? "block" : "none";
        });

        window.renderCurrentSection = function () {
            const grid = document.getElementById("cardsGrid");
            const q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
            const source = currentSection === "apps" ? appsData : xmlData;

            const filtered = source.filter(item => {
                if (!q) return true;
                const hay = `${item.name || ""} ${item.title || ""} ${item.category || ""} ${item.type || ""} ${item.description || ""}`.toLowerCase();
                return hay.includes(q);
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Koi item nahi mila.</div>`;
                return;
            }

            grid.innerHTML = "";
            filtered.forEach((item) => {
                const isPaid = Boolean(item.isPaid);
                const price = Number(item.price || (currentSection === "apps" ? 29 : 9));
                const title = window.sanitizeText(item.name || item.title || "Item");
                const desc = window.sanitizeText(item.description || "");
                const icon = safeUrl(item.logoUrl || item.thumbUrl || (Array.isArray(item.photos) ? item.photos[0] : "")) || FALLBACK_ICON;
                const catLabel = item.category || item.type || (currentSection === "apps" ? "App" : "XML");

                const card = document.createElement("div");
                card.className = "card reveal-item";
                card.innerHTML = `
                    <div class="card-head">
                        <img src="${icon}" alt="${title}" class="card-icon" onerror="this.src='${FALLBACK_ICON}'">
                        <div style="min-width:0; flex:1;">
                            <div class="card-title styled-name-text">${title}</div>
                            <div class="badges">
                                <span class="badge badge-cat">${catLabel}</span>
                                <span class="badge ${isPaid ? "badge-paid" : "badge-free"}">
                                    ${isPaid ? `PAID • ₹${price}` : "FREE"}
                                </span>
                            </div>
                        </div>
                    </div>
                    ${desc ? `<p class="card-desc styled-name-text">${desc}</p>` : ""}
                    <div class="card-actions">
                        <button type="button" class="btn btn-ghost" onclick="openItemModal('${currentSection}', '${item.id}')">
                            <i class="fa-regular fa-eye"></i> Preview
                        </button>
                        ${isPaid
                            ? `<button type="button" class="btn btn-paid" onclick="unlockPaidItem('${currentSection}', '${item.id}')"><i class="fa-solid fa-lock"></i> Unlock ₹${price}</button>`
                            : `<a href="${safeUrl(item.downloadUrl || item.protectedLink)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary"><i class="fa-solid fa-download"></i> Download</a>`
                        }
                    </div>
                `;
                grid.appendChild(card);
            });

            window.observeRevealElements();
        };

        window.openItemModal = function (section, id) {
            const list = section === "apps" ? appsData : xmlData;
            const item = list.find(x => x.id === id);
            if (!item) return;

            const isPaid = Boolean(item.isPaid);
            const price = Number(item.price || (section === "apps" ? 29 : 9));
            const title = window.sanitizeText(item.name || item.title || "Item");
            const desc = window.sanitizeText(item.description || "No description provided.");
            const photos = Array.isArray(item.photos) ? item.photos.map(safeUrl).filter(Boolean) : [];
            const downloadLink = safeUrl(item.downloadUrl || item.protectedLink);

            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalBadges").innerHTML = `
                <span class="badge badge-cat">${item.category || item.type || "Item"}</span>
                <span class="badge ${isPaid ? "badge-paid" : "badge-free"}">${isPaid ? `PAID • ₹${price}` : "FREE"}</span>
            `;
            document.getElementById("modalDesc").innerText = desc;

            const shotsWrap = document.getElementById("modalShots");
            shotsWrap.innerHTML = photos.map(p => `<img src="${p}" alt="Preview" class="shot-img" onclick="openPhotoLightbox('${p}')">`).join("");

            const actionArea = document.getElementById("modalActionArea");
            if (isPaid) {
                actionArea.innerHTML = `
                    <button type="button" class="btn btn-paid" onclick="unlockPaidItem('${section}', '${item.id}')">
                        <i class="fa-solid fa-unlock"></i> Unlock Link (₹${price})
                    </button>
                `;
            } else if (downloadLink) {
                actionArea.innerHTML = `
                    <a href="${downloadLink}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                        <i class="fa-solid fa-download"></i> Open Download Link
                    </a>
                `;
            } else {
                actionArea.innerHTML = "";
            }

            document.getElementById("previewModal").classList.add("open");
        };

        window.closeModal = function () {
            document.getElementById("previewModal").classList.remove("open");
        };

        window.unlockPaidItem = function (section, id) {
            const list = section === "apps" ? appsData : xmlData;
            const item = list.find(x => x.id === id);
            if (!item) return;
            const link = safeUrl(item.downloadUrl || item.protectedLink);
            if (link) {
                window.open(link, "_blank", "noopener,noreferrer");
                window.showToast("Download link opened!");
            } else {
                window.showToast("Link available nahi hai.");
            }
        };
    </script>
</body>
</html>
