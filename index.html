<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">MAGGIE STORE - App Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root, [data-theme="dark"] {
            --bg: #0c0f14;
            --surface: #141922;
            --surface-2: #1c2330;
            --ink: #f4f6fb;
            --muted: #9aa4b8;
            --accent: #10b981;
            --accent-ink: #04130d;
            --warm: #f59e0b;
            --border: rgba(255, 255, 255, 0.09);
            --shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
        }

        [data-theme="light"] {
            --bg: #f6f4ef;
            --surface: #ffffff;
            --surface-2: #ece8df;
            --ink: #141820;
            --muted: #5b6475;
            --accent: #059669;
            --accent-ink: #ffffff;
            --warm: #d97706;
            --border: rgba(20, 24, 32, 0.11);
            --shadow: 0 12px 28px rgba(20, 24, 32, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: 12px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
        }

        .store-logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            object-fit: cover;
            border: 1.5px solid var(--accent);
            background: var(--surface-2);
        }

        .logo-text {
            font-family: 'Fraunces', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.02em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--ink);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            width: 195px;
            outline: none;
            transition: border-color 0.2s, width 0.25s;
        }

        .search-box:focus {
            border-color: var(--accent);
            width: 235px;
        }

        .theme-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--ink);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .hero-wrap {
            max-width: 1140px;
            width: 100%;
            margin: 24px auto 8px;
            padding: 0 20px;
        }

        .hero-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: "";
            position: absolute;
            top: -50px;
            right: -50px;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle, color-mix(in srgb, var(--warm) 22%, transparent), transparent 70%);
            pointer-events: none;
        }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--warm);
            margin-bottom: 10px;
        }

        .hero-card h1 {
            font-family: 'Fraunces', serif;
            font-size: 2.2rem;
            line-height: 1.15;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .hero-card p {
            color: var(--muted);
            font-size: 0.93rem;
            max-width: 560px;
        }

        .social-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 18px;
        }

        .social-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--ink);
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 11px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .social-pill:hover {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
        }

        .category-bar {
            max-width: 1140px;
            width: 100%;
            margin: 14px auto 4px;
            padding: 0 20px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .category-bar::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--surface);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
        }

        .container {
            max-width: 1140px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 20px 36px;
            flex: 1;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 18px;
        }

        .app-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .app-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .app-icon {
            width: 66px;
            height: 66px;
            border-radius: 16px;
            object-fit: cover;
            background: var(--surface-2);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .cat-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 13%, transparent);
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .app-title {
            font-weight: 700;
            font-size: 1.02rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-desc-short {
            font-size: 0.78rem;
            color: var(--muted);
            margin: 3px 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .install-btn {
            background: var(--accent);
            color: var(--accent-ink);
            font-weight: 700;
            border: none;
            padding: 6px 15px;
            border-radius: 10px;
            font-size: 0.78rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .install-btn:hover { opacity: 0.9; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.68);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-content {
            background: var(--surface);
            color: var(--ink);
            padding: 28px 22px;
            border-radius: 22px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            position: relative;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--muted);
        }

        .modal-icon {
            width: 84px;
            height: 84px;
            border-radius: 20px;
            margin-bottom: 10px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .modal-desc {
            color: var(--muted);
            font-size: 0.88rem;
            margin: 12px 0 22px;
            line-height: 1.6;
            max-height: 150px;
            overflow-y: auto;
        }

        footer {
            border-top: 1px solid var(--border);
            background: var(--surface);
            padding: 22px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 0.82rem;
            margin-top: auto;
        }

        footer .social-bar {
            justify-content: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .search-box { width: 120px; font-size: 0.78rem; }
            .search-box:focus { width: 145px; }
            .hero-card h1 { font-size: 1.7rem; }
            .logo-text { font-size: 1.12rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <img id="storeLogo" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='88' height='88'%3E%3Crect width='100%25' height='100%25' rx='22' fill='%2310b981'/%3E%3Ctext x='50%25' y='58%25' dominant-baseline='middle' text-anchor='middle' font-size='40' font-family='Arial,sans-serif' font-weight='bold' fill='%23ffffff'%3EM%3C/text%3E%3C/svg%3E" alt="Logo" class="store-logo" referrerpolicy="no-referrer" decoding="async">
            <span id="storeName" class="logo-text">MAGGIE STORE</span>
        </a>
        <div class="header-right">
            <input type="text" id="searchInput" class="search-box" placeholder="Search apps...">
            <button type="button" id="themeBtn" class="theme-toggle" title="Toggle Dark/Light Theme" onclick="toggleTheme()">
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>
    </header>

    <div class="hero-wrap">
        <section class="hero-card">
            <div class="kicker"><i class="fa-solid fa-sparkles"></i> Curated & Direct</div>
            <h1 id="heroTitle">Discover & Download Apps</h1>
            <p id="heroSubtitle">Fast, verified, and direct downloads powered by MAGGIE STORE</p>
            <div id="socialBar" class="social-bar"></div>
        </section>
    </div>

    <div id="categoryBar" class="category-bar"></div>

    <div class="container">
        <div id="loader" style="text-align:center; padding:36px; color:var(--accent); font-weight:600;">Loading MAGGIE STORE...</div>
        <div id="appGrid" class="app-grid"></div>
    </div>

    <footer>
        <div id="footerSocials" class="social-bar"></div>
        <p>&copy; 2026 <span class="store-footer-text">MAGGIE STORE</span>. All rights reserved.</p>
    </footer>

    <div id="appModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalIcon" src="" alt="Icon" class="modal-icon" referrerpolicy="no-referrer" decoding="async">
            <div id="modalCat" class="cat-badge" style="margin-bottom:6px;">General</div>
            <h2 id="modalTitle" style="font-family:'Fraunces',serif;">App Name</h2>
            <p id="modalDesc" class="modal-desc"></p>
            <a id="modalDownload" href="#" target="_blank" class="install-btn" style="padding: 11px 28px; font-size: 0.9rem;">
                <i class="fa-solid fa-download"></i> Download Now
            </a>
        </div>
    </div>

    <script>
        (function initSavedTheme() {
            const saved = localStorage.getItem("maggie_theme") || "dark";
            document.documentElement.setAttribute("data-theme", saved);
            updateThemeIcon(saved);
        })();

        function updateThemeIcon(theme) {
            const btn = document.getElementById("themeBtn");
            if (!btn) return;
            btn.innerHTML = theme === "dark"
                ? '<i class="fa-solid fa-sun"></i>'
                : '<i class="fa-solid fa-moon"></i>';
        }

        window.toggleTheme = function () {
            const current = document.documentElement.getAttribute("data-theme") || "dark";
            const next = current === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("maggie_theme", next);
            updateThemeIcon(next);
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz5VFvZ4nb7XOd8R72uW-aCYoLp0A_DAk",
            authDomain: "maggie-store-d3f3f.firebaseapp.com",
            projectId: "maggie-store-d3f3f",
            storageBucket: "maggie-store-d3f3f.firebasestorage.app",
            messagingSenderId: "646860878839",
            appId: "1:646860878839:web:1dd29cff6636c45bf374f2",
            measurementId: "G-BSTQZS5KQJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const appGrid = document.getElementById('appGrid');
        const categoryBar = document.getElementById('categoryBar');
        const searchInput = document.getElementById('searchInput');
        const socialBar = document.getElementById('socialBar');
        const footerSocials = document.getElementById('footerSocials');

        const FALLBACK_STORE = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='88' height='88'%3E%3Crect width='100%25' height='100%25' rx='22' fill='%2310b981'/%3E%3Ctext x='50%25' y='58%25' dominant-baseline='middle' text-anchor='middle' font-size='40' font-family='Arial,sans-serif' font-weight='bold' fill='%23ffffff'%3EM%3C/text%3E%3C/svg%3E";
        const FALLBACK_APP = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'%3E%3Crect width='100%25' height='100%25' rx='24' fill='%231c2330'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='24' font-family='Arial,sans-serif' fill='%239aa4b8'%3EAPP%3C/text%3E%3C/svg%3E";

        let allApps = [];
        let activeCategory = 'All';
        localStorage.removeItem('maggie_resolved_img_v1');
        const CACHE_KEY = 'maggie_resolved_img_v2';
        const resolvedCache = new Map(Object.entries(JSON.parse(localStorage.getItem(CACHE_KEY) || '{}')));

        function saveResolvedCache(raw, direct) {
            resolvedCache.set(raw, direct);
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(Object.fromEntries(resolvedCache)));
            } catch (_) {}
        }

        function cleanUrl(raw) {
            const val = (raw || '').trim();
            if (!val) return '';
            if (!val.startsWith('http://') && !val.startsWith('https://') && !val.startsWith('data:image/')) {
                return 'https://' + val;
            }
            return val;
        }

        async function resolveImageUrl(rawUrl) {
            const url = cleanUrl(rawUrl);
            if (!url) return '';
            if (resolvedCache.has(url)) return resolvedCache.get(url);

            const ibbMatch = url.match(/^https?:\/\/(?:www\.)?ibb\.co\/([a-zA-Z0-9_-]+)\/?$/i);
            if (ibbMatch) {
                const proxies = [
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    `https://corsproxy.io/?${encodeURIComponent(url)}`,
                    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
                ];
                for (const proxyUrl of proxies) {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 3000);
                    try {
                        const res = await fetch(proxyUrl, { signal: controller.signal });
                        clearTimeout(timer);
                        if (!res.ok) continue;
                        const html = await res.text();
                        const match = html.match(/https?:\/\/i\.ibb\.co\/[a-zA-Z0-9_-]+\/[^"'\s<>\\]+/i);
                        if (match && match[0]) {
                            saveResolvedCache(url, match[0]);
                            return match[0];
                        }
                    } catch (_) {
                        clearTimeout(timer);
                    }
                }
            }

            saveResolvedCache(url, url);
            return url;
        }

        async function loadReliableImage(imgEl, rawUrl, fallbackUrl) {
            if (!imgEl) return;
            imgEl.referrerPolicy = 'no-referrer';
            const cleaned = cleanUrl(rawUrl);
            if (!cleaned) {
                imgEl.src = fallbackUrl;
                return;
            }

            const targetUrl = await resolveImageUrl(cleaned);

            imgEl.onerror = async () => {
                imgEl.onerror = null;
                try {
                    const res = await fetch(targetUrl);
                    if (res.ok) {
                        const blob = await res.blob();
                        if (blob.type.startsWith('image/')) {
                            imgEl.src = URL.createObjectURL(blob);
                            return;
                        }
                    }
                } catch (_) {}
                imgEl.src = fallbackUrl;
            };

            imgEl.src = targetUrl;
        }

        onSnapshot(doc(db, "settings", "general"), (docSnap) => {
            if (docSnap.exists()) {
                const settings = docSnap.data();
                if (settings.logoUrl) {
                    loadReliableImage(document.getElementById('storeLogo'), settings.logoUrl, FALLBACK_STORE);
                }
                if (settings.storeName) {
                    document.getElementById('storeName').innerText = settings.storeName;
                    document.getElementById('pageTitle').innerText = settings.storeName + " - App Hub";
                    document.getElementById('heroSubtitle').innerText = "Fast, verified, and direct downloads powered by " + settings.storeName;
                    document.querySelectorAll('.store-footer-text').forEach(el => el.innerText = settings.storeName);
                }
            }
        });

        function getPlatformIcon(platform) {
            const p = (platform || '').toLowerCase();
            if (p.includes('insta')) return 'fa-brands fa-instagram';
            if (p.includes('tele')) return 'fa-brands fa-telegram';
            if (p.includes('disc')) return 'fa-brands fa-discord';
            if (p.includes('you')) return 'fa-brands fa-youtube';
            if (p.includes('whats')) return 'fa-brands fa-whatsapp';
            if (p.includes('x') || p.includes('twit')) return 'fa-brands fa-x-twitter';
            if (p.includes('git')) return 'fa-brands fa-github';
            return 'fa-solid fa-link';
        }

        onSnapshot(collection(db, "socials"), (snapshot) => {
            socialBar.innerHTML = '';
            footerSocials.innerHTML = '';
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const iconClass = getPlatformIcon(data.platform);
                const html = `
                    <a href="${cleanUrl(data.url)}" target="_blank" class="social-pill">
                        <i class="${iconClass}"></i> ${data.platform}
                    </a>
                `;
                socialBar.innerHTML += html;
                footerSocials.innerHTML += html;
            });
        });

        onSnapshot(collection(db, "apps"), (snapshot) => {
            document.getElementById('loader').style.display = 'none';
            allApps = [];
            const categories = new Set(['All']);

            snapshot.forEach((docSnap) => {
                const appData = { id: docSnap.id, ...docSnap.data() };
                allApps.push(appData);
                if (appData.category) categories.add(appData.category);
            });

            renderCategories(Array.from(categories));
            filterAndRender();
        }, (err) => {
            document.getElementById('loader').innerHTML = `<span style="color:#ef4444;">Error: ${err.message}</span>`;
        });

        function renderCategories(cats) {
            categoryBar.innerHTML = '';
            cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${activeCategory === cat ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterAndRender();
                };
                categoryBar.appendChild(btn);
            });
        }

        function filterAndRender() {
            const term = searchInput.value.toLowerCase();
            const filtered = allApps.filter(appItem => {
                const name = (appItem.name || '').toLowerCase();
                const matchesSearch = name.includes(term);
                const matchesCat = activeCategory === 'All' || (appItem.category || 'General') === activeCategory;
                return matchesSearch && matchesCat;
            });
            renderApps(filtered);
        }

        function renderApps(apps) {
            appGrid.innerHTML = '';
            if (apps.length === 0) {
                appGrid.innerHTML = '<p style="color:var(--muted); grid-column: 1/-1; text-align:center; padding:20px;">No apps found in this category.</p>';
                return;
            }

            apps.forEach((appItem) => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <img src="${FALLBACK_APP}" alt="Icon" class="app-icon" decoding="async">
                    <div class="app-info">
                        <span class="cat-badge">${appItem.category || 'General'}</span>
                        <div class="app-title">${appItem.name || 'Unnamed App'}</div>
                        <div class="app-desc-short">${appItem.description || 'Tap to view details'}</div>
                        <a href="${cleanUrl(appItem.downloadUrl) || '#'}" target="_blank" class="install-btn" onclick="event.stopPropagation()">
                            <i class="fa-solid fa-download"></i> Install
                        </a>
                    </div>
                `;
                loadReliableImage(card.querySelector('.app-icon'), appItem.logoUrl, FALLBACK_APP);
                card.onclick = () => openModal(appItem);
                appGrid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', filterAndRender);

        window.openModal = (appItem) => {
            loadReliableImage(document.getElementById('modalIcon'), appItem.logoUrl, FALLBACK_APP);
            document.getElementById('modalCat').innerText = appItem.category || 'General';
            document.getElementById('modalTitle').innerText = appItem.name || 'App';
            document.getElementById('modalDesc').innerText = appItem.description || 'No description provided for this app.';
            document.getElementById('modalDownload').href = cleanUrl(appItem.downloadUrl) || '#';
            document.getElementById('appModal').style.display = 'flex';
        };

        window.closeModal = () => document.getElementById('appModal').style.display = 'none';
        window.onclick = (e) => { if (e.target === document.getElementById('appModal')) closeModal(); };
    </script>
</body>
</html>
